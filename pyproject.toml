[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rupp-senior-kb"
version = "2.0.0"
description = "RUPP Senior Project Knowledge Base (Telegram search, portfolios, and consent-gated contact)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# Runtime pins are intentionally kept in requirements.txt so there is one
# canonical install list. This table carries project metadata and the dev extra.
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Private :: Do Not Upload",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0",
    "pytest-cov==7.1.0",
    "ruff==0.17.6",
    "black==26.10.1",
]

[tool.setuptools]
py-modules = ["cli", "config", "logging_config"]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "answer*",
    "bot*",
    "datasets*",
    "eval*",
    "ingestion*",
    "retrieval*",
    "store*",
]
exclude = ["data", "docs*", "implementation*", "legacy*", "tests*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
norecursedirs = [".git", ".venv", "data", "docs", "implementation", "legacy"]
markers = [
    "integration: requires a live Qdrant and/or Ollama service",
    "slow: long-running test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["."]
extend-exclude = ["legacy", "data", "docs", "implementation", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = [
    "answer",
    "bot",
    "config",
    "datasets",
    "eval",
    "ingestion",
    "logging_config",
    "retrieval",
    "store",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
    legacy
  | data
  | docs
  | implementation
  | \.venv
)/
'''

[tool.coverage.run]
source = [
    "answer",
    "bot",
    "datasets",
    "eval",
    "ingestion",
    "retrieval",
    "store",
]
omit = ["legacy/*", "tests/*"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
