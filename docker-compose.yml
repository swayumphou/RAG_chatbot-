# RUPP-SPKB v2.0 stack.
#
#   docker compose up -d qdrant              # vector store (ingestion and eval run on the host)
#   docker compose --profile llm up -d ollama
#   docker compose exec ollama ollama pull gemma4:12b-it-qat   # one time, for ENABLE_LLM=true
#   docker compose up -d bot                 # needs TELEGRAM_BOT_TOKEN and KB_SALT in .env
#
# Qdrant server v1.20.0 is pinned to match qdrant-client==1.20.0 (requirements.txt).
# It has not been verified against a running server yet: before trusting eval
# numbers, run ingestion and `python -m ingestion.verify` against this server.
# Secrets are read from .env / the environment; none are written here.

services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage

  ollama:  # only needed when ENABLE_LLM=true
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    # NVIDIA GPU passthrough, if available:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: 1, capabilities: [gpu] }]

  bot:
    build: .
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: gemma4:12b-it-qat  # pinned; never "latest"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      KB_SALT: ${KB_SALT}
      ENABLE_LLM: ${ENABLE_LLM:-false}
      ABSTAIN_THRESHOLD: ${ABSTAIN_THRESHOLD:-0.45}
    volumes:
      - ./data:/app/data  # SQLite metadata store
      - ./logs:/app/logs
      - ./data/hf_cache:/root/.cache/huggingface  # bge-m3 is downloaded once
    depends_on:
      - qdrant
    restart: unless-stopped
